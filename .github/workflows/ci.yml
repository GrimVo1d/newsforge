name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: black --check src tests
      - run: isort --check-only src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_USER: nf
          POSTGRES_PASSWORD: nf
          POSTGRES_DB: newsforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nf:nf@localhost:5432/newsforge_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: newsforge.settings.test
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Install PG extensions
        run: |
          PGPASSWORD=nf psql -h localhost -U nf -d newsforge_test -c "CREATE EXTENSION IF NOT EXISTS unaccent;"
          PGPASSWORD=nf psql -h localhost -U nf -d newsforge_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - run: pytest -q --cov=src --cov-report=term

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: newsforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
