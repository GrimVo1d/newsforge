[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsforge"
version = "0.1.0"
description = "RSS/Atom aggregator with PostgreSQL full-text search"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GrimVo1d" }]
dependencies = [
    "Django>=5.2.18,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.2",
    "drf-spectacular>=0.27",
    "celery>=5.3",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "feedparser>=6.0",
    "httpx>=0.27",
    "bleach>=6.1",
    "langdetect>=1.0.9",
    "passlib[argon2]>=1.7",
    "prometheus-client>=0.20",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
    "celery-types>=0.23",
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["**/migrations/**", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Django Meta options (indexes, constraints, ordering) are idiomatic class-level lists.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "newsforge", "tasks"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "newsforge.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "newsforge.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "RUF001"]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 30
